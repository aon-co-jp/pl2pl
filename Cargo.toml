[package]
name = "pl2pl"
version = "0.2.2"
edition = "2021"
description = "pl2pl: platform / HPC porting converters (COBOL+JCL to Linux, UNIX C to portable C, OpenMP, Kokkos, Numba)"
license = "MIT"

[dependencies]
regex = "1"
walkdir = "2"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
ureq = "2"
open-cpu = { git = "https://github.com/aon-co-jp/open-cpu" }
